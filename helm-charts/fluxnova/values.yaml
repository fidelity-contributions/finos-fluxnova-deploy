replicaCount: 1
env:
  FLUXNOVA_HOST: "fluxnova.example.com"
  FLUXNOVA_BPM_TEST_USER_SETUP_ENABLED: "true"
  FLUXNOVA_BPM_AUTHORIZATION_ENABLED: "true"

# Database configuration.
database:
  # Set to true to enable injection of DB_* env vars
  enabled: true

  # One Kubernetes Secret containing DB_URL, DB_USERNAME, DB_PASSWORD
  # This Secret will be loaded into the container using envFrom.secretRef.
  envFromSecretName: "fluxnova-db"
  driver: "org.postgresql.Driver"

image:
  name: ghcr.io/finos/fluxnova-examples
  tag: 1.0.0
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  "keel.sh/policy": "force"
  "keel.sh/trigger": "poll"
  "keel.sh/pollSchedule": "@every 10m"

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
